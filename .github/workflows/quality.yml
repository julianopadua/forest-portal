name: Quality

on:
  push:
  pull_request:

jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Generate API artifacts
        run: |
          npm run api:openapi
          npm run docs:bundle
          git diff --exit-code -- public/api/v1/openapi.json src/lib/docs/docs.generated.json
      - name: Build production application
        run: npm run build
